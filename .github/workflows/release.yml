name: Release

# Publishing to Maven Central is done by the maintainer (`mvn deploy`, signed with GPG).
# This workflow attaches the shaded agent jar to the GitHub release, which gives a stable download link:
#   https://github.com/dpsoft/ap-agent/releases/latest/download/ap-agent.jar
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  attach-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify -Dgpg.skip=true

      - name: Attach the agent jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          jar="target/ap-agent-${version}.jar"
          if [ "v${version}" != "${TAG}" ] && [ "${version}" != "${TAG}" ]; then
            echo "::error::pom version ${version} does not match the release tag ${TAG}"; exit 1
          fi
          cp "$jar" target/ap-agent.jar
          gh release upload "$TAG" "$jar" target/ap-agent.jar --clobber
