name: CI

on:
  push:
    branches: [ main, 'integration/**' ]
  pull_request:
    branches: [ main, 'integration/**' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ '11', '17', '21', '25' ]
        include:
          # async-profiler ships linux-arm64 natives too: make sure the agent loads and profiles there
          - os: ubuntu-24.04-arm
            java: '21'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test (unit + smoke tests)
        run: mvn -B -ntp verify -Dgpg.skip=true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Coverage of the smoke tests (shaded agent with -javaagent)
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'
        run: scripts/coverage-it.sh

      - name: Upload coverage to Codecov
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # repository secret; pull requests from forks upload without it
          files: target/site/jacoco/jacoco.xml,target/site/jacoco-it/jacoco.xml
          disable_search: true
          fail_ci_if_error: false # a Codecov outage must not fail the build

      - name: Upload coverage report
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/site/jacoco-it/
          retention-days: 14

      - name: Upload compatibility report
        if: always() && matrix.java == '21' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-report
          path: target/compatibility-report.md
          if-no-files-found: ignore
          retention-days: 14
