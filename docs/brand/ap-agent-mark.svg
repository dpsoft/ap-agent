<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="ap-agent">
  <title>ap-agent</title>
  <!-- An icicle: async-profiler flame graph turned upside down (root on top, the way the docs show them),
       frames hanging in steps from the left. Colours are async-profiler frame types: the root, Java (green),
       C++ / JVM (yellow), kernel (orange), inlined (cyan). -->
  <g>
    <rect x="4"  y="6"  width="56" height="9" rx="2.5" fill="#e15a5a"/>
    <rect x="4"  y="17" width="33" height="9" rx="2.5" fill="#50e150"/>
    <rect x="39" y="17" width="21" height="9" rx="2.5" fill="#c8c83c"/>
    <rect x="4"  y="28" width="20" height="9" rx="2.5" fill="#50e150" opacity=".75"/>
    <rect x="26" y="28" width="11" height="9" rx="2.5" fill="#3fbfbf"/>
    <rect x="39" y="28" width="12" height="9" rx="2.5" fill="#e17d00"/>
    <rect x="4"  y="39" width="12" height="9" rx="2.5" fill="#3fbfbf"/>
    <rect x="18" y="39" width="6"  height="9" rx="2.5" fill="#50e150" opacity=".55"/>
    <rect x="4"  y="50" width="6"  height="9" rx="2.5" fill="#7fd9d9"/>
  </g>
</svg>
